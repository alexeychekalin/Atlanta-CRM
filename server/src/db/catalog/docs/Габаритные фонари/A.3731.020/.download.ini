2-х функциональный (габаритный огонь, светоотражатель)
Биполярный
Сверхнизкий уровень электропотребления
Европейский сертификат E28
Защита от высоковольтных электромагнитных импульсов бортовой сети
 
Функции:
Свет передний габаритный со светоотражателем
Свет задний габаритный со светоотражателем
Свет боковой габаритный со светоотражателем
 
Параметры:
Источник света: 1 светодиод
Напряжение питания: 12-24 В
Диапазон рабочих температур окружающей среды 
от – 55°C до +65°C
Климатическое исполнение - О по ГОСТ 15150
Степень защиты: IP69 ГОСТ 14254
 
Потребляемая мощность (номинальная):
12V/24V = 0,24W/0,45W
