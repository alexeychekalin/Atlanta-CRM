4-х функциональный (габаритный огонь задний, сигнал торможения, указатель поворота, подсветка номерного знака)
Биполярный
Низкий уровень электропотребления
Европейский сертификат E28
Конструкция фонаря устойчива к ударам и механическим повреждениям
Защита от высоковольтных электромагнитных импульсов бортовой сети
 
Функции:
Свет габаритный задний
Стоп-сигнал
Свет указателя поворота
Освещение номерного знака ТС
 
Параметры:
Источник света: светодиод
Напряжение питания: 12-24 В
Диапазон рабочих температур окружающей среды 
от – 40°C до +55°C
Климатическое исполнение - О по ГОСТ 15150
Степень защиты: IP69 ГОСТ 14254
 
Потребляемая мощность (номинальная):
Свет габаритный 12В/24В = 0,12Вт/0,24Вт
Стоп-сигнал 12В/24В = 1,44Вт/3,1Вт
Свет указателя поворота 12В/24В = 0,36Вт/1,44Вт
Подсветка номера 12В/24В = 0,54Вт/1,08Вт
