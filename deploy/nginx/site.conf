# ─────────────────────────────────────────────────────────────────────────────
# Сайт завода «Атланта» — статическая сборка из site/dist
#
# Шаблон. Не редактируйте копию в /etc/nginx вручную: её перезаписывает
# scripts/setup-nginx.sh при каждом запуске.
#
#   sudo DOMAIN=atlanta.ru ./scripts/setup-nginx.sh
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root __SITE_ROOT__;
    index index.html;
    charset utf-8;

    client_max_body_size 8m;

    # сжатие: html, css, js, svg, json, sitemap
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # фотографии каталога не меняются (в имени файла — хэш), кэшируем надолго
    location /img/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # у css и js в имени нет хэша — кэш короткий
    location /static/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # страницы: /catalog/ → /catalog/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # скрытые файлы (кроме .well-known для ACME)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
