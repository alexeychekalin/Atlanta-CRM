# ─────────────────────────────────────────────────────────────────────────────
# CRM «Атланта» — Node.js на 127.0.0.1:3000
#
# Шаблон. Копию в /etc/nginx перезаписывает scripts/setup-nginx.sh.
#
#   sudo DOMAIN=atlanta.ru ./scripts/setup-nginx.sh     → crm.atlanta.ru:80
#   sudo ./scripts/setup-nginx.sh                       → :8080, без домена
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen __LISTEN__;
    listen [::]:__LISTEN__;
    server_name __CRM_HOST__;

    client_max_body_size 50m;

    # заголовки безопасности выставляет приложение (helmet),
    # здесь только то, что касается прокси
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
